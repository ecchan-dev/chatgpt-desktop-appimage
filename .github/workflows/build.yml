name: Build AppImage

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "keys/**"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: chatgpt-appimage-release
  cancel-in-progress: false

env:
  REPACK_REVISION: "2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils cpio file gnupg rpm rpm2cpio

      - name: Build and smoke-test AppImage
        run: bash ./scripts/build-appimage.sh

      - name: Check whether this package release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat dist/version.txt)"
          tag="v${version}-r${REPACK_REVISION}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest release provenance
        if: steps.release.outputs.exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ChatGPT-x86_64.AppImage
            dist/ChatGPT-x86_64.AppImage.zsync
            dist/SHA256SUMS

      - name: Publish release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "${TAG}" --title "ChatGPT ${VERSION} (AppImage r${REPACK_REVISION})" --notes "Unofficial AppImage repackaged from OpenAI's official, signature-verified Linux RPM. Release files have GitHub build-provenance attestations." dist/ChatGPT-x86_64.AppImage dist/ChatGPT-x86_64.AppImage.zsync dist/SHA256SUMS
